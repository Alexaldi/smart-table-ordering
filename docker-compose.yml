services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sto-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - sto-network

  nginx:
    image: nginx:alpine
    container_name: sto-nginx
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sto-network

  mysql:
    image: mysql:8.4
    container_name: sto-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_table_ordering
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3307:3306"
    volumes:
      - sto-mysql-data:/var/lib/mysql
    networks:
      - sto-network

volumes:
  sto-mysql-data:

networks:
  sto-network:
